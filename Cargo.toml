[package]
name = "blackout-lw"
version = "0.1.0"
edition = "2021"
description = "Blackout lightweight spoof worker for routers/low-end devices (DNS reflector amplification)"
license = "MIT"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"      # 体积优先
lto = true
codegen-units = 1
panic = "abort"      # 无 unwinding，体积小
strip = true

[profile.dev]
opt-level = 1
