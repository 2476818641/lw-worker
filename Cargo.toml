[package]
name = "blackout-lw"
version = "0.1.0"
edition = "2021"
description = "Blackout lightweight spoof worker for routers/low-end devices (DNS reflector amplification)"
license = "MIT"

[dependencies]
# 版本固定兼容 Rust 1.74（MIPS 目标只能用旧工具链编译）。
libc = "=0.2.150"
serde = { version = "=1.0.195", features = ["derive"] }
serde_json = "=1.0.111"

[profile.release]
opt-level = "z"      # 体积优先
lto = true
codegen-units = 1
panic = "abort"      # 无 unwinding，体积小
strip = true

[profile.dev]
opt-level = 1
