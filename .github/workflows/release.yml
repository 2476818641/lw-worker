name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (required for manual trigger)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: lw-worker-x86_64
            image_tag: x86_64-musl
          - target: armv7-unknown-linux-musleabihf
            asset: lw-worker-armv7
            image_tag: armv7-musleabihf
          - target: aarch64-unknown-linux-musl
            asset: lw-worker-aarch64
            image_tag: aarch64-musl
          - target: mipsel-unknown-linux-musl
            asset: lw-worker-mipsel
            image_tag: mipsel-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mipsel-unknown-linux-musl 的预编译 rust-std 只在 1.74 提供。
      # 用 messense/rust-musl-cross 镜像（内置完整 musl 交叉工具链），
      # 镜像内 rustup 安装 1.74 后编译——避开 zig 与 rustc 1.74 的 crt/gcc_s 冲突。
      - name: Build (docker musl-cross + Rust 1.74)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            messense/rust-musl-cross:${{ matrix.image_tag }} \
            bash -c "rustup toolchain install 1.74.0 --profile minimal --target ${{ matrix.target }} \
              && cargo +1.74.0 build --release --target ${{ matrix.target }} \
              && cp target/${{ matrix.target }}/release/blackout-lw /work/${{ matrix.asset }}"

      - name: Inspect artifact
        run: |
          ls -lh ${{ matrix.asset }}
          file ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
