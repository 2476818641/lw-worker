name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (required for manual trigger)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: lw-worker-x86_64
            zig_target: x86_64-linux-musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
          - target: armv7-unknown-linux-musleabihf
            asset: lw-worker-armv7
            zig_target: arm-linux-musleabihf
            linker_env: CARGO_TARGET_ARMV7_UNKNOWN_LINUX_MUSLEABIHF_LINKER
          - target: aarch64-unknown-linux-musl
            asset: lw-worker-aarch64
            zig_target: aarch64-linux-musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
          - target: mipsel-unknown-linux-musl
            asset: lw-worker-mipsel
            zig_target: mipsel-linux-musl
            linker_env: CARGO_TARGET_MIPSEL_UNKNOWN_LINUX_MUSL_LINKER
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # mipsel-unknown-linux-musl 的预编译 rust-std 只在 1.74 提供，
      # 全部平台统一用 1.74 保证行为一致（依赖版本已 pin 兼容）
      - name: Install Rust 1.74
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.74.0
          targets: ${{ matrix.target }}

      - name: Setup zig (cross linker for all musl targets)
        uses: goto-bus-stop/setup-zig@v2
        with:
          # 固定 0.13.0：cargo-zigbuild 与新版 zig 对 mipsel target 解析不兼容
          version: 0.13.0

      # 直接以 zig cc 作为链接器（wrapper 指定 target），
      # 绕开 cargo-zigbuild 对 mipsel 的 target 转换 bug
      - name: Build (release, static musl via zig)
        env:
          ZIG_TARGET: ${{ matrix.zig_target }}
        run: |
          cat > /tmp/zigcc.sh <<'EOF'
          #!/bin/sh
          exec zig cc -target "$ZIG_TARGET" -O0 "$@"
          EOF
          chmod +x /tmp/zigcc.sh
          export ${{ matrix.linker_env }}=/tmp/zigcc.sh
          cargo build --release --target ${{ matrix.target }}
          cp target/${{ matrix.target }}/release/blackout-lw ${{ matrix.asset }}
          ls -lh ${{ matrix.asset }}
          file ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
