name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (required for manual trigger)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ============================================================
  # 稳定组：最新 stable，覆盖 x86_64 / aarch64 / ARMv7 / ARMv5 / ARMv6
  # ============================================================
  build-stable:
    name: Build ${{ matrix.target }} (stable)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            asset: lw-worker-x86_64
            image_tag: x86_64-musl
          - target: aarch64-unknown-linux-musl
            asset: lw-worker-aarch64
            image_tag: aarch64-musl
          - target: armv7-unknown-linux-musleabihf
            asset: lw-worker-armv7
            image_tag: armv7-musleabihf
          # ARMv5TE：向后兼容 ARMv5 / ARMv6 / ARMv7（软浮点）
          - target: arm-unknown-linux-musleabi
            asset: lw-worker-armv5
            image_tag: arm-musleabi
          # ARMv6 硬浮点：性能更好，要求目标设备有 FPU
          - target: arm-unknown-linux-musleabihf
            asset: lw-worker-armv6hf
            image_tag: arm-musleabihf

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (docker musl-cross + latest stable)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            messense/rust-musl-cross:${{ matrix.image_tag }} \
            bash -c "export CARGO_TARGET_DIR=/work/target && \
              rustup toolchain uninstall stable || true && \
              rustup toolchain install stable --profile minimal --no-self-update && \
              rustup target add ${{ matrix.target }} && \
              cargo +stable build --release --locked --target ${{ matrix.target }} && \
              cp /work/target/${{ matrix.target }}/release/blackout-lw /work/${{ matrix.asset }}"

      - name: Inspect artifact
        run: |
          ls -lh ${{ matrix.asset }}
          file ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ============================================================
  # Legacy 组：Rust 1.74，仅用于 MIPS 小端 + MIPS 大端
  # ============================================================
  build-legacy:
    name: Build ${{ matrix.target }} (1.74)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: mipsel-unknown-linux-musl
            asset: lw-worker-mipsel
            image_tag: mipsel-musl
          - target: mips-unknown-linux-musl
            asset: lw-worker-mips
            image_tag: mips-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build (docker musl-cross + Rust 1.74)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            messense/rust-musl-cross:${{ matrix.image_tag }} \
            bash -c "export CARGO_TARGET_DIR=/work/target && \
              rustup toolchain install 1.74.0 --profile minimal --target ${{ matrix.target }} && \
              cargo +1.74.0 build --release --locked --target ${{ matrix.target }} && \
              cp /work/target/${{ matrix.target }}/release/blackout-lw /work/${{ matrix.asset }}"

      - name: Inspect artifact
        run: |
          ls -lh ${{ matrix.asset }}
          file ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  # ============================================================
  # Release：等待稳定组 + Legacy 组全部完成
  # ============================================================
  release:
    name: Create Release
    needs: [build-stable, build-legacy]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist/*
